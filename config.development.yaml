# fing 本地开发配置
# 对应 docker-compose 默认值（fing:fingpass@localhost:3306/fing）
# 启动 fing-app 时用 CONFIGOR_ENV=development 加载此文件
# （默认 dev 模式，直接 go run main.go 也行）

mode: dev
secret: dev-secret-please-change-in-production-min-32-chars
level: 4
port: 9765

dataSource:
  main: fing:fingpass@tcp(localhost:3306)/fing?charset=utf8mb4&parseTime=True&loc=Local

redis:
  addr: localhost:6379

es:
  esUrl: ""
  esUsername: ""
  esPassword: ""

email:
  host: smtp.gmail.com
  name: "fing Dev"
  email: dev@example.com
  password: ""